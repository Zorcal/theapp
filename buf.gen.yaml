version: v2
managed:
  enabled: true
# clean: true is intentionally absent — the pb/ output directory contains hand-written
# files (log_value.go, doc.go) alongside generated ones. Enabling clean would delete them
# on every run. Orphaned generated files from proto renames are caught at compile time.
plugins:
  # Go plugins
  - local: scripts/protoc-gen-go
    out: backend/internal/api/grpc/internal/pb/
    opt:
      - paths=source_relative
  - local: scripts/protoc-gen-go-grpc
    out: backend/internal/api/grpc/internal/pb/
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - local: scripts/protoc-gen-grpc-gateway
    out: backend/internal/api/grpc/internal/pb/
    opt:
      - paths=source_relative
  - local: scripts/protoc-gen-openapiv2
    out: schemas/openapi/internal/
    strategy: all
    opt:
      - output_format=json
      - allow_merge=true
      - merge_file_name=theapp
  # Second output for Go embed — backend/ is a separate Go module and //go:embed cannot
  # reach outside its root, so the spec is also written here for use by the gateway server.
  - local: scripts/protoc-gen-openapiv2
    out: backend/internal/api/grpc/gateway/openapi/internal/
    strategy: all
    opt:
      - output_format=json
      - allow_merge=true
      - merge_file_name=theapp

  # Customer API publication explicitly excludes internal services. Reuse this list for customer
  # SDK plugins so those services cannot enter customer artifacts by accident.
  - local: scripts/protoc-gen-openapiv2
    out: schemas/openapi/customer/
    strategy: all
    exclude_types: &internal_api_types
      - theapp.v1.SystemRoleService
      - theapp.v1.UserService
    opt:
      - output_format=json
      - allow_merge=true
      - merge_file_name=theapp
  - local: scripts/protoc-gen-openapiv2
    out: backend/internal/api/grpc/gateway/openapi/customer/
    strategy: all
    exclude_types: *internal_api_types
    opt:
      - output_format=json
      - allow_merge=true
      - merge_file_name=theapp

  # TypeScript plugins
  # - local: frontend/node_modules/.bin/protoc-gen-es
  #   out: frontend/app/gen/pb
  #   include_imports: true
  #   opt:
  #     - target=ts

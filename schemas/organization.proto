syntax = "proto3";

package theapp.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "user.proto";

option go_package = "github.com/zorcal/theapp/backend/internal/api/grpc/internal/pb;pb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "theapp Organization API"
    version: "v1"
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Access token from VerifyMagicLink or RefreshAccessToken. Format: 'Bearer {token}'"
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

// OrgService manages organizations and their users.
service OrgService {
  // Creates an organization with a control project and a named default project.
  rpc CreateOrganization(CreateOrganizationRequest) returns (Organization) {
    option (google.api.http) = {
      post: "/v1/organizations"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {
          description: "gRPC INVALID_ARGUMENT. A default project name that conflicts with the control project includes ErrorDetail.code ERROR_CODE_CONTROL_PROJECT_NAME_CONFLICT; ordinary validation errors do not include an application error code."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Missing or invalid credentials."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "403"
        value: {
          description: "Organization creation authority or system-organization membership is missing."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "Authenticated creator not found."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Organization name already exists."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      parameters: {
        headers: {
          name: "x-project-id"
          description: "ID of the system organization's control project."
          type: INTEGER
          required: true
        }
      }
    };
  }

  // Creates a system user when needed and adds that user to the organization selected through
  // its control project.
  rpc CreateOrganizationUser(CreateOrganizationUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/organizations/users"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {
          description: "Invalid email or project metadata."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Missing or invalid credentials."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "403"
        value: {
          description: "Organization-user creation access is missing or the selected project is not the organization's control project."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      parameters: {
        headers: {
          name: "x-project-id"
          description: "ID of the organization control project."
          type: INTEGER
          required: true
        }
      }
    };
  }

  // Lists users belonging to the organization selected through its control project.
  rpc ListOrganizationUsers(ListOrganizationUsersRequest) returns (ListOrganizationUsersResponse) {
    option (google.api.http) = {get: "/v1/organizations/users"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {description: "Invalid pagination, filtering, or project metadata." schema: {json_schema: {ref: ".google.rpc.Status"}}}
      }
      responses: {
        key: "401"
        value: {description: "Missing or invalid credentials." schema: {json_schema: {ref: ".google.rpc.Status"}}}
      }
      responses: {
        key: "403"
        value: {description: "Organization-user read access is missing or the selected project is not the organization's control project." schema: {json_schema: {ref: ".google.rpc.Status"}}}
      }
      responses: {
        key: "404"
        value: {description: "Filtered project not found in the organization." schema: {json_schema: {ref: ".google.rpc.Status"}}}
      }
      responses: {
        key: "500"
        value: {description: "Unexpected server error." schema: {json_schema: {ref: ".google.rpc.Status"}}}
      }
      parameters: {
        headers: {name: "x-project-id" description: "ID of the organization control project." type: INTEGER required: true}
      }
    };
  }
}

// Organization represents a tenant.
message Organization {
  // Unique identifier for the organization.
  int32 id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Display name of the organization.
  string name = 2;

  // Unique identifier for the project anchoring organization-level administration.
  int32 control_project_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Timestamp when the organization was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Timestamp when the organization was last updated.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for creating an organization.
message CreateOrganizationRequest {
  // Organization to create. Only name is accepted as input.
  Organization organization = 1 [(google.api.field_behavior) = REQUIRED];

  // Display name for the organization's initial non-control project.
  string project_name = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for creating or assigning an organization user.
message CreateOrganizationUserRequest {
  // Email address identifying the system user.
  string email = 1 [(google.api.field_behavior) = REQUIRED];
}

message OrganizationUserFilter {
  // Restrict results to organization members with effective access to this project.
  int32 project_id = 1;
}

message ListOrganizationUsersRequest {
  // Maximum number of users to return. Defaults to 50 and is capped at 100.
  int32 page_size = 1;

  // Opaque token returned by the previous page.
  string page_token = 2;

  // Optional criteria restricting the users returned.
  OrganizationUserFilter filter = 3;
}

message ListOrganizationUsersResponse {
  // Organization users in email order.
  repeated User users = 1;

  // Total number of users matching the filter, independent of pagination.
  int32 total_size = 2;

  // Opaque token for the next page, or empty when this is the final page.
  string next_page_token = 3;
}

syntax = "proto3";

package theapp.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/zorcal/theapp/backend/internal/api/grpc/internal/pb;pb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "theapp Project API"
    version: "v1"
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Access token from VerifyMagicLink or RefreshAccessToken. Format: 'Bearer {token}'"
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

// ProjectService provides project discovery and management.
service ProjectService {
  // Lists the projects accessible to the authenticated caller.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {
      get: "/v1/projects"
    };
  }
}

// Project represents a project within an organization.
message Project {
  // Unique identifier for the project.
  int32 id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Unique identifier for the organization that owns the project.
  int32 organization_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Display name of the project.
  string name = 3;

  // Whether the project anchors organization-level administrative operations.
  bool is_control = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Timestamp when the project was created.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Timestamp when the project was last updated.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The ETag for the current version of the project. Helps to prevent
  // simultaneous updates of a project from overwriting each other ("mid-air
  // collisions").
  //
  // If this is provided on update, it must match the server's ETag.
  string etag = 7 [(google.api.field_behavior) = OUTPUT_ONLY, (google.api.field_info).format = UUID4];
}

// Request message for listing accessible projects.
message ListProjectsRequest {
  // Maximum number of projects to return.
  int32 page_size = 1;

  // Token for fetching the next page of results.
  string page_token = 2;
}

// Response message for listing accessible projects.
message ListProjectsResponse {
  // Projects accessible to the authenticated caller.
  repeated Project projects = 1;

  // Total number of accessible projects.
  int32 total_size = 2;

  // Token for fetching the next page of results, if applicable.
  string next_page_token = 3;
}

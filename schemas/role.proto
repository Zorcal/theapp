// RoleKind identifies who owns an organization role's definition.
enum RoleKind {
  ROLE_KIND_UNSPECIFIED = 0;
  ROLE_KIND_CUSTOM = 1;
  ROLE_KIND_ORGANIZATION_ADMIN = 2;
}

// Role is an organization-owned role.
message Role {
  // Unique identifier for the role.
  string id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];

  // Name of the role.
  string name = 2;

  // Permissions granted to the role.
  repeated Permission permissions = 3;

  // Timestamp when the role was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Timestamp when the role was last updated.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ETag for the current version of the role.
  string etag = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];

  // Identifies whether the definition is user-managed or application-managed.
  RoleKind kind = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Narrowest scope at which this role may be assigned.
  AssignmentScope minimum_assignment_scope = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for creating a custom role.
message CreateRoleRequest {
  // The role to create.
  Role role = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for getting a custom role.
message GetRoleRequest {
  // ID of the role to get.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// Request message for listing custom roles.
message ListRolesRequest {
  // Maximum number of roles to return.
  int32 page_size = 1;

  // Token for fetching the next page.
  string page_token = 2;
}

// Response message for listing custom roles.
message ListRolesResponse {
  // Custom roles owned by the caller's organization.
  repeated Role roles = 1;

  // Total number of matching roles.
  int32 total_size = 2;

  // Token for fetching the next page.
  string next_page_token = 3;
}

// Request message for listing a user's project-scoped custom-role assignments.
message ListProjectRoleAssignmentsRequest {
  // ID of the user whose assignments to list.
  string user_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // Maximum number of assignments to return.
  int32 page_size = 2;

  // Token for fetching the next page.
  string page_token = 3;
}

// Response message for listing a user's project-scoped custom-role assignments.
message ListProjectRoleAssignmentsResponse {
  // Custom roles assigned directly in the request's project.
  repeated Role roles = 1;

  // Total number of matching assignments.
  int32 total_size = 2;

  // Token for fetching the next page.
  string next_page_token = 3;
}

// Request message for listing a user's organization-scoped custom-role assignments.
message ListOrganizationRoleAssignmentsRequest {
  // ID of the user whose assignments to list.
  string user_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // Maximum number of assignments to return.
  int32 page_size = 2;

  // Token for fetching the next page.
  string page_token = 3;
}

// Response message for listing a user's organization-scoped custom-role assignments.
message ListOrganizationRoleAssignmentsResponse {
  // Custom roles assigned across the request project's organization.
  repeated Role roles = 1;

  // Total number of matching assignments.
  int32 total_size = 2;

  // Token for fetching the next page.
  string next_page_token = 3;
}

// Request message for updating a custom role.
message UpdateRoleRequest {
  // The role to update.
  Role role = 1 [(google.api.field_behavior) = REQUIRED];

  // Fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for modifying a custom role's permissions.
message ModifyRolePermissionsRequest {
  // ID of the role to modify.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // Permission names to add to the role.
  repeated Permission add_permissions = 2;

  // Permission names to remove from the role.
  repeated Permission remove_permissions = 3;
}

// Request message for deleting a custom role.
message DeleteRoleRequest {
  // ID of the role to delete.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// Response message for deleting a custom role.
message DeleteRoleResponse {}

// Request message for assigning a custom role in the request's project.
message AssignRoleToProjectRequest {
  // ID of the role to assign.
  string role_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // ID of the user to assign the role to.
  string user_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// Response message for assigning a custom role in a project.
message AssignRoleToProjectResponse {}

// Request message for unassigning a custom role in the request's project.
message UnassignRoleFromProjectRequest {
  // ID of the role to unassign.
  string role_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // ID of the user to unassign the role from.
  string user_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// Response message for unassigning a custom role from a project.
message UnassignRoleFromProjectResponse {}

// Request message for assigning a custom role across the request project's organization.
message AssignRoleToOrganizationRequest {
  // ID of the role to assign.
  string role_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // ID of the user to assign the role to.
  string user_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// Response message for assigning a custom role across an organization.
message AssignRoleToOrganizationResponse {}

// Request message for unassigning a custom role across the request project's organization.
message UnassignRoleFromOrganizationRequest {
  // ID of the role to unassign.
  string role_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // ID of the user to unassign the role from.
  string user_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// Response message for unassigning a custom role from an organization.
message UnassignRoleFromOrganizationResponse {}

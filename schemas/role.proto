syntax = "proto3";

package theapp.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "permission.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/zorcal/theapp/backend/internal/api/grpc/internal/pb;pb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "theapp Role API"
    version: "v1"
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Access token from VerifyMagicLink or RefreshAccessToken. Format: 'Bearer {token}'"
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

// RoleService manages custom roles owned by the caller's organization.
service RoleService {
  // Creates a custom role.
  rpc CreateRole(CreateRoleRequest) returns (Role) {
    option (google.api.http) = {
      post: "/v1/roles"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {
          description: "Invalid role data or project metadata, or the role name already exists."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Missing or invalid credentials."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "403"
        value: {
          description: "Role creation or permission-superset authority is missing."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "Organization or permission not found."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      parameters: {
        headers: {
          name: "x-project-id"
          description: "ID of a project in the role's organization."
          type: INTEGER
          required: true
        }
      }
    };
  }

  // Gets a custom role owned by the caller's organization.
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (google.api.http) = {get: "/v1/roles/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {
          description: "Invalid role ID or project metadata."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Missing or invalid credentials."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "403"
        value: {
          description: "Custom-role read access is missing."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "Role not found in the selected organization."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      parameters: {
        headers: {
          name: "x-project-id"
          description: "ID of a project in the role's organization."
          type: INTEGER
          required: true
        }
      }
    };
  }

  // Lists custom roles owned by the caller's organization.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/v1/roles"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {

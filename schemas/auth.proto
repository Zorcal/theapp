syntax = "proto3";

package theapp.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/protobuf/empty.proto";
import "google/rpc/status.proto";
import "permission.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/zorcal/theapp/backend/internal/api/grpc/internal/pb;pb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "theapp Auth API"
    version: "v1"
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Access token from VerifyMagicLink or RefreshAccessToken. Format: 'Bearer {token}'"
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

// AuthService provides passwordless authentication via magic-link emails.
service AuthService {
  // RequestMagicLink sends a sign-in link to the given email address.
  // If no account exists for the address, one is created automatically.
  // Always returns success to avoid leaking whether the address is registered.
  rpc RequestMagicLink(RequestMagicLinkRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/auth/magic-link"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      responses: {
        key: "400"
        value: {
          description: "Invalid email address."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      parameters: {
        headers: {
          name: "x-idempotency-key"
          description: "A client-generated UUID. Retrying the same request with the same key returns the original result instead of sending a second sign-in email."
          type: STRING
          required: false
        }
      }
    };
  }

  // VerifyMagicLink exchanges a magic-link token for an access/refresh token pair.
  rpc VerifyMagicLink(VerifyMagicLinkRequest) returns (TokenPair) {
    option (google.api.http) = {
      post: "/v1/auth/verify"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      responses: {
        key: "400"
        value: {
          description: "Invalid request."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Magic-link token is invalid or expired."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
    };
  }

  // RefreshAccessToken rotates the refresh token and issues a new token pair.
  // The supplied refresh token is revoked upon success.
  rpc RefreshAccessToken(RefreshAccessTokenRequest) returns (TokenPair) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      responses: {
        key: "400"
        value: {
          description: "Invalid request."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Refresh token is invalid, expired, or revoked."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
    };
  }

  // RevokeRefreshToken invalidates a refresh token, ending the session.
  rpc RevokeRefreshToken(RevokeRefreshTokenRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/auth/revoke"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      responses: {
        key: "400"
        value: {
          description: "Invalid request."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "Refresh token does not exist or was already revoked."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
    };
  }

  // RevokeAllSessions revokes all active refresh tokens for the authenticated user, ending all sessions.
  // Requires a valid access token.
  rpc RevokeAllSessions(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/auth/sessions/revoke-all"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "401"
        value: {
          description: "Missing or invalid credentials."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
    };
  }

  // GetAuthContext returns authorization context for the authenticated caller and selected
  // project.
  rpc GetAuthContext(GetAuthContextRequest) returns (AuthContext) {
    option (google.api.http) = {get: "/v1/auth/context"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {
          description: "Missing or invalid project metadata."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Missing or invalid credentials."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "Caller or project no longer exists."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Unexpected server error."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      parameters: {
        headers: {
          name: "x-project-id"
          description: "ID of the project for which authorization context is resolved."
          type: INTEGER
          required: true
        }
      }
    };
  }
}

// Request message for RequestMagicLink.
message RequestMagicLinkRequest {
  // Email address to send the sign-in link to.
  string email = 1;
}

// Request message for VerifyMagicLink.
message VerifyMagicLinkRequest {
  // The token from the magic-link URL query parameter.
  string token = 1;
}

// Request message for RefreshAccessToken.
message RefreshAccessTokenRequest {
  // The refresh token issued by a previous VerifyMagicLink or RefreshAccessToken call.
  string refresh_token = 1;
}

// Request message for RevokeRefreshToken.
message RevokeRefreshTokenRequest {
  // The refresh token to revoke.
  string refresh_token = 1;
}

// Request message for retrieving the caller's authorization context.
message GetAuthContextRequest {}

// TokenPair holds a short-lived JWT access token and a long-lived refresh token.
message TokenPair {
  // JWT bearer token. Include as: Authorization: Bearer <access_token>.
  string access_token = 1;

  // Opaque refresh token. Use with RefreshAccessToken to obtain a new pair.
  string refresh_token = 2;

  // Remaining lifetime of access_token in seconds.
  int64 expires_in = 3;
}

// AuthContext contains authorization data for the authenticated caller and selected project.
message AuthContext {
  // The caller's user ID.
  string user_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];

  // The caller's email address.
  string email = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Permissions effective in the selected project.
  repeated Permission project_permissions = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Permissions effective in the selected project's organization.
  repeated Permission organization_permissions = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Permissions effective system-wide.
  repeated Permission system_permissions = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}
